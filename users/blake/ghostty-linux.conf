# Linux VM overrides for ghostty.
#
# home-manager.nix appends this to dotfiles/ghostty/config, so every key here
# is read after the shared config and wins over it. Keep this file to things
# that are genuinely wrong on Linux -- the shared config stays the source of
# truth for appearance.

# Nix owns the ghostty binary. The updater is macOS-only (Sparkle) anyway, but
# say so explicitly rather than relying on it being a no-op here.
auto-update = off

# Let KWin draw the frame. GTK client-side decorations look out of place next
# to every other window in Plasma.
window-decoration = server

# Plasma reserves Super for its own global shortcuts -- Super+Left/Right tile
# the window, Super alone opens the launcher -- so the shared super+* binds
# either never reach ghostty or fight the desktop. Drop them and use ghostty's
# Linux convention instead.
keybind = super+r=unbind
keybind = super+i=unbind
keybind = super+f=unbind
keybind = super+left=unbind
keybind = super+right=unbind

keybind = ctrl+shift+r=reload_config
keybind = ctrl+shift+i=inspector:toggle
keybind = f11=toggle_fullscreen
keybind = ctrl+shift+left=previous_tab
keybind = ctrl+shift+right=next_tab

# Keybinds to match macOS since this is a VM
keybind = super+c=copy_to_clipboard
keybind = super+v=paste_from_clipboard
keybind = super+shift+c=copy_to_clipboard
keybind = super+shift+v=paste_from_clipboard
keybind = super+equal=increase_font_size:1
keybind = super+minus=decrease_font_size:1
keybind = super+zero=reset_font_size
keybind = super+q=quit
keybind = super+shift+comma=reload_config
keybind = super+k=clear_screen
keybind = super+n=new_window
keybind = super+w=close_surface
keybind = super+shift+w=close_window
keybind = super+t=new_tab
keybind = super+shift+left_bracket=previous_tab
keybind = super+shift+right_bracket=next_tab
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+right_bracket=goto_split:next
keybind = super+left_bracket=goto_split:previous
