# i3 config for the Linux VM. Linked to ~/.config/i3/config by home-manager.
#
# $mod is Mod1 (Alt), NOT the usual Mod4. VMware Fusion maps the Mac's Command
# key to Super in the guest, and ghostty's config binds a full set of
# macOS-style super+* shortcuts (copy, paste, new tab, splits...) that we want
# to keep working unchanged. Leaving Super entirely to ghostty means i3 has to
# take Alt.
#
# The cost of that choice: i3 grabs these combos before any application sees
# them, so fish's Alt bindings on the same letters are gone inside the
# terminal -- notably alt+h (whatis), alt+l (list dir), alt+k, alt+j, and
# alt+1..0. Everything else fish binds on Alt (alt+., alt+e, alt+s,
# alt+backspace, alt+left/right) is untouched.
set $mod Mod1

# Colors, matching the one-dark theme ghostty uses (dotfiles/ghostty/themes).
set $bg        #17191d
set $altbg     #21252b
set $grey      #434852
set $lightgrey #5c6370
set $fg        #abb2bf
set $red       #ef596f
set $green     #89ca78
set $yellow    #e5c07b
set $blue      #4a90d9

#----------------------------------------------------------------------
# Look & Feel
#----------------------------------------------------------------------
font pango:Consolas 7NF 9

default_orientation horizontal

new_window pixel 2
new_float pixel 2
floating_minimum_size 400 x 300
floating_maximum_size -1 x -1
focus_follows_mouse no

# class                 border     background text        indicator  child_border
client.focused          $blue      $blue      $bg         $green     $blue
client.focused_inactive $grey      $grey      $fg         $grey      $grey
client.unfocused        $altbg     $altbg     $lightgrey  $altbg     $grey
client.urgent           $red       $red       $bg         $red       $red
client.placeholder      $bg        $bg        $fg         $bg        $bg
client.background       $bg

#----------------------------------------------------------------------
# Startup
#----------------------------------------------------------------------
# Solid background. No wallpaper daemon on purpose -- one less thing to run.
exec_always --no-startup-id xsetroot -solid "$bg"

# Polkit agent, so anything asking for authorization gets a prompt instead of
# failing silently.
exec --no-startup-id lxqt-policykit-agent

# Resize the desktop to match the hypervisor window.
exec --no-startup-id display-autofit

#----------------------------------------------------------------------
# Keybindings
#----------------------------------------------------------------------
# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod

# --gtk-single-instance makes every new window reuse the running process,
# which is the difference between instant and a second of startup.
bindsym $mod+Return exec ghostty --gtk-single-instance=true

bindsym $mod+o exec --no-startup-id rofi -show drun
bindsym $mod+Shift+o exec --no-startup-id rofi -show run

# kill focused window. Shifted so plain alt+q still reaches applications.
bindsym $mod+Shift+q kill

# change focus
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Split direction.
bindsym $mod+backslash split h
bindsym $mod+minus split v

# enter fullscreen mode for the focused container
bindsym $mod+Shift+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+Shift+s layout stacking
bindsym $mod+Shift+w layout tabbed
bindsym $mod+Shift+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# change focus between tiling / floating windows
bindsym $mod+space focus mode_toggle

# focus the parent container
bindsym $mod+Shift+a focus parent

# Define names for default workspaces for which we configure key bindings later on.
# We use variables to avoid repeating the names in multiple places.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# reload the configuration file
bindsym $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Shift+r restart

#----------------------------------------------------------------------
# Resize Mode
#----------------------------------------------------------------------
set $mode_resize Resize / Move

# This mode will make it easier to resize and move workspaces without
# having to bind a bunch of obscure bindings.
mode "$mode_resize" {
        # These bindings trigger as soon as you enter the resize mode

        # Focus parent and child
        bindsym a focus parent
        bindsym $mod+a focus parent
        bindsym c focus child
        bindsym $mod+c focus child

        # Move containers
        bindsym 1 move container to workspace number $ws1; workspace number $ws1
        bindsym 2 move container to workspace number $ws2; workspace number $ws2
        bindsym 3 move container to workspace number $ws3; workspace number $ws3
        bindsym 4 move container to workspace number $ws4; workspace number $ws4
        bindsym 5 move container to workspace number $ws5; workspace number $ws5
        bindsym 6 move container to workspace number $ws6; workspace number $ws6
        bindsym 7 move container to workspace number $ws7; workspace number $ws7
        bindsym 8 move container to workspace number $ws8; workspace number $ws8
        bindsym 9 move container to workspace number $ws9; workspace number $ws9
        bindsym 0 move container to workspace number $ws10; workspace number $ws10

        # h shrinks width, l grows it; j grows height, k shrinks it.
        bindsym h resize shrink width 10 px or 10 ppt
        bindsym j resize grow height 10 px or 10 ppt
        bindsym k resize shrink height 10 px or 10 ppt
        bindsym l resize grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

bindsym $mod+r mode "$mode_resize"

#----------------------------------------------------------------------
# System Mode
#----------------------------------------------------------------------
# shutdown / restart / suspend...
set $mode_system System (e) logout, (r) reboot, (Ctrl+s) shutdown

mode "$mode_system" {
    bindsym e exec --no-startup-id i3-msg exit, mode "default"
    bindsym r exec --no-startup-id systemctl reboot, mode "default"
    bindsym Ctrl+s exec --no-startup-id systemctl poweroff -i, mode "default"

    # back to normal: Enter or Escape
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+BackSpace mode "$mode_system"

# Start i3bar to display a workspace bar (plus the system information i3status
# finds out, if available)
bar {
    status_command i3status
    position top
    separator_symbol " | "

    font pango:Consolas 7NF 9

    colors {
        background $bg
        statusline $fg
        separator  $grey

        #                  border  background text
        focused_workspace  $blue   $blue      $bg
        active_workspace   $grey   $grey      $fg
        inactive_workspace $bg     $bg        $lightgrey
        urgent_workspace   $red    $red       $bg
        binding_mode       $yellow $yellow    $bg
    }
}
