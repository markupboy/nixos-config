# i3status config for the i3bar in desktop/i3.conf.
# Linked to ~/.config/i3status/config by home-manager.

general {
    output_format = "i3bar"
    interval = 5
    colors = true
    color_good = "#89ca78"
    color_degraded = "#e5c07b"
    color_bad = "#ef596f"
}

order += "disk /"
order += "memory"
order += "load"
order += "ethernet _first_"
order += "tztime local"

disk "/" {
    format = "disk %avail"
}

memory {
    format = "mem %used / %total"
    threshold_degraded = "10%"
    format_degraded = "mem LOW %available"
}

load {
    format = "load %1min"
}

# _first_ rather than a hardcoded name: the VM's NIC shows up as ens160 under
# VMware and eth0 elsewhere, and this config is shared by both VM machines.
ethernet _first_ {
    format_up = "%ip"
    format_down = "no link"
}

tztime local {
    format = "%Y-%m-%d %H:%M "
}
